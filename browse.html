<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse — claude-system</title><link rel="stylesheet" href="/style.css"><script>document.documentElement.classList.add("js")</script></head><body><a class="skip" href="#main">Skip</a>
<header class="hdr" role="banner"><div class="hdr-inner"><a class="brand" href="/"><span class="brand-mark">CS</span><span class="wordmark">claude-system <span>Registry</span></span></a><nav class="nav"><a href="/">Registry</a><a href="/browse" aria-current="page">Browse</a><a href="/docs">Docs</a><a href="https://github.com/hariomlohardev/claude-system" target="_blank" rel="noreferrer">GitHub ↗</a><a class="btn primary sm" href="https://github.com/hariomlohardev/claude-system" target="_blank" rel="noreferrer">Star ↗</a></nav><button class="ham" id="ham" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-panel"><span></span><span></span><span></span></button></div><div class="mobile-panel" id="mobile-panel" aria-hidden="true"><a href="/">Registry</a><a href="/browse" aria-current="page">Browse</a><a href="/docs">Docs</a></div></header>
<main id="main"><section class="wrap" style="padding-top:32px;border-bottom:1px solid var(--line)"><h1 style="font-size:32px">Systems catalog</h1><p class="muted">Search live via <code class="inline">/api/search?q=</code></p><div class="toolbar"><label class="field"><input id="q" type="search" placeholder="name, keyword…" aria-label="Search"><button class="btn sm ghost" id="clear">Clear</button></label><div class="pills" id="pills"></div></div><p id="status" class="small muted"></p></section><section class="wrap"><div id="ledger" class="ledger"></div><div id="empty" class="hidden"><p class="muted">No systems match.</p></div></section></main>
<footer class="footer"><div class="footer-grid"><div class="footer-brand">Catalog</div><div class="footer-col"><h4>Systems</h4><a href="/browse">Browse</a></div><div class="footer-col"><h4>Docs</h4><a href="/docs">Docs</a></div><div class="footer-col"><h4>Links</h4><a href="https://github.com/hariomlohardev/claude-system">GitHub ↗</a></div></div><div class="footer-bar"><span>© 2026 claude-system</span><a href="#" onclick="window.scrollTo(0,0);return false">Back to top ↑</a></div></footer>
<script src="/app.js"></script>
<script>
var q=document.getElementById("q"), pills=document.getElementById("pills"), ledger=document.getElementById("ledger"), status=document.getElementById("status");
var cats=["All","open-source","frontend","backend","testing","security","docs","research","devops","other"];
var active="All", all=[];
function renderPills(){pills.innerHTML=cats.map(function(c){return "<button class=\"pill"+(c===active?" active":"")+"\">"+c+"</button>";}).join("");}
renderPills();
function card(s){return "<div class=\"row\"><div class=\"row-left\">"+(s.category||"other")+"</div><div class=\"row-body\"><h3><a href=\"/system?name="+s.name+"\">"+s.name+"</a></h3><p>"+(s.description||"")+"</p></div><div class=\"row-right\"><a href=\"/system?name="+s.name+"\">View →</a></div></div>";}
function render(list){ledger.innerHTML=list.map(card).join("");status.textContent=list.length+" system(s)";}
fetch("/api/registry").then(function(r){return r.json();}).then(function(j){all=j.systems||[];render(all);});
q.addEventListener("input",function(){var v=q.value.toLowerCase();var list=all.filter(function(s){return !v|| (s.name+" "+s.description).toLowerCase().indexOf(v)!==-1;});render(list);});
</script>
</body></html>
