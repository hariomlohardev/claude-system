# ADR — Registry Cache API (not a marketplace / not scope creep)
# Why: raw.githubusercontent.com uncached on every `list` doesn't scale (see audit F.17) — edge cache is the minimal fix.
# What: read-through cache — source of truth remains registry/index.json (generated from systems/*/system.json).
#        This workflow mirrors it to Supabase so Vercel can serve GET /api/registry at the edge.
# How:  CLI two-tier fetch — primary https://claude-system-tau.vercel.app/api/registry (s-maxage=60, fast) → fallback raw.githubusercontent.com (always-fresh, resilient) via cli/src/lib/registry.ts
# Scope: read-only cache only — no auth, no teams, no marketplace. If Vercel/Supabase die, raw fallback keeps install working. See SYSTEM_SPEC.md §46 footnote.
name: Sync Registry to Supabase
on:
  push:
    branches: [main]
    paths: [systems/**, registry/index.json, scripts/generate-index.js]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci
      - name: Build CLI
        working-directory: cli
        run: npm run build
      - name: Generate registry
        run: node scripts/generate-index.js
      - name: Upsert Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-supabase.js
