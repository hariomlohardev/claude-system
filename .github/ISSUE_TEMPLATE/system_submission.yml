name: System submission checklist
description: Checklist for proposing a new System (use a PR for the actual submission)
labels: [system]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      description: Complete this before opening the PR. The PR itself should touch only systems/<name>/.
      options:
        - label: My System is in `systems/<name>/` and `name` === folder name (kebab-case)
          required: true
        - label: "`system.json` validates (name === folder, semver version, keywords, permissions honestly declared)"
          required: true
        - label: Required files present — `CLAUDE.md` and `README.md` (plus `system.json`)
          required: true
        - label: 'If `setup.sh` exists: `WHY` message present (`# WHY:` or echo) and `permissions` includes `shell:exec`'
          required: false
        - label: I ran `node cli/dist/index.js validate systems/<name>` locally and it passes
          required: true
        - label: I did not hand-edit `registry/index.json` (it is generated by `node scripts/generate-index.js`)
          required: true

  - type: input
    id: system-name
    attributes:
      label: System name
      description: Kebab-case name of the System (must equal folder name)
      placeholder: e.g. my-new-system
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: What does the System do, who is it for, any notes for the reviewer
      placeholder: Brief description for triage
    validations:
      required: false
